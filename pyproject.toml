[project]
name = "solar-leads"
version = "0.1.0"
description = "Prepara listas de leads (donos de estabelecimentos) por região para disparo via GHL"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "fastapi>=0.162.7",
    "uvicorn>=0.54.0",
    "reportlab>=4.2",
]

[project.scripts]
leads = "solar_leads.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_leads"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
