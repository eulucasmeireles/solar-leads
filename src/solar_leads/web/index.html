<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Solar Leads</title>
  <script>
    (function () {
      try {
        var t = new URLSearchParams(location.search).get('tema');
        if (!t) { try { t = localStorage.getItem('solar-tema'); } catch (e) { t = null; } }
        if (t === 'escuro') document.documentElement.setAttribute('data-tema', 'escuro');
        // Dados sensíveis borrados: pela URL (?demo=1) ou pela escolha guardada no botão de olho.
        var p = new URLSearchParams(location.search).get('demo') === '1';
        if (!p) { try { p = localStorage.getItem('solar-privado') === '1'; } catch (e) { p = false; } }
        if (p) document.documentElement.setAttribute('data-demo', '');
      } catch (e) { /* tema claro */ }
    })();
  </script>
  <link rel="preload" href="/static/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="casca" id="casca">
    <a class="pular" id="pular" href="#conteudo">Pular para o conteúdo</a>

    <header class="topo">
      <div class="topo-in">
        <a class="marca" href="#/" aria-label="Solar Leads, ir para o início">
          <span class="marca-ic" id="marca-ic" aria-hidden="true"></span>
          <span class="marca-nome">Solar Leads</span>
        </a>
        <nav class="nav" id="nav" aria-label="Principal">
          <a href="#/" data-rota="inicio" data-icone="casa"><span class="nav-ic"></span><span class="nav-tx">Início</span></a>
          <a href="#/listas" data-rota="listas" data-icone="listas"><span class="nav-ic"></span><span class="nav-tx">Listas</span></a>
          <a href="#/pastas" data-rota="pastas" data-icone="pasta"><span class="nav-ic"></span><span class="nav-tx">Pastas</span></a>
          <a href="#/whatsapp" data-rota="whatsapp" data-icone="whatsapp"><span class="nav-ic"></span><span class="nav-tx">WhatsApp</span></a>
          <a href="#/base" data-rota="base" data-icone="base"><span class="nav-ic"></span><span class="nav-tx">Base</span></a>
        </nav>
        <div class="topo-dir">
          <button class="btn-tema" id="btn-olho" type="button" aria-pressed="false" aria-label="Borrar dados sensíveis"></button>
        <button class="btn-tema" id="btn-tema" type="button" aria-label="Alternar tema claro e escuro"></button>
          <button class="btn-sair" id="btn-sair" type="button" hidden>Sair</button>
        </div>
      </div>
    </header>

    <main id="conteudo" class="conteudo" tabindex="-1"></main>
  </div>

  <div id="modais"></div>
  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <script src="/static/util.js"></script>
  <script src="/static/ui.js"></script>
  <script src="/static/graficos.js"></script>
  <script src="/static/inicio.js"></script>
  <script src="/static/lista.js"></script>
  <script src="/static/pastas.js"></script>
  <script src="/static/outras.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
